name: Build Vivify Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install QPM
      run: |
        wget https://github.com/QuestPackageManager/QPM.CLI/releases/download/v0.17.5/qpm-0.17.5-linux.zip
        unzip qpm-0.17.5-linux.zip
        chmod +x qpm
        sudo mv qpm /usr/local/bin/
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build
    
    - name: Restore dependencies
      run: qpm restore
    
    - name: Build
      run: |
        mkdir build
        cd build
        cmake ..
        cmake --build .
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mod
        path: build/*.qmod
